[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "downloadity"
version = "0.1.0"
description = "A minimalist mobile app to download music and videos from anywhere (including Spotify)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "eggplanta" }
]
dependencies = [
    "yt-dlp",
    "spotifyscraper",
    "kivy"
]

[tool.setuptools.packages.find]
where = ["src"]
